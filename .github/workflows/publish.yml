# Publishes to npm with a provenance statement (required for n8n verified community nodes).
# Runs when a GitHub release is published. Needs the repository secret NPM_TOKEN
# (npm automation/granular token with publish rights), or npm trusted publishing configured for this repo.
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

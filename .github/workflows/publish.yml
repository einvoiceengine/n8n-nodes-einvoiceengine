# Publishes to npm with a provenance statement when a GitHub release is published.
# Uses npm trusted publishing (OIDC): the package settings on npmjs.com list this repo
# and workflow publish.yml as a trusted publisher, so no npm token is stored here.
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public
